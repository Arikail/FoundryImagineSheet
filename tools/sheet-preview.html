<!doctype html>
<meta charset="utf-8">
<title>Imagine RPG sheet preview</title>
<link rel="stylesheet" href="../styles/imagine-rpg.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.7.8/handlebars.min.js"></script>
<style>
	body { margin: 0; background: #3a3632; font-family: "Signika", "Segoe UI", sans-serif; }
	.frame { max-width: 860px; margin: 18px auto; background: #fdfbf6; border-radius: 5px;
	         box-shadow: 0 8px 30px rgba(0,0,0,.45); overflow: hidden; }
	.frame-title { background: #22201d; color: #d8d0c0; padding: 7px 12px; font-size: 13px; }
	.window-content { padding: 12px 14px; }
	.tabstrip { display: flex; gap: 4px; border-bottom: 2px solid #cfc7b8; margin: 10px 0 12px; }
	.tabstrip button { padding: 5px 14px; border: 1px solid #cfc7b8; border-bottom: none;
	                   border-radius: 3px 3px 0 0; background: #efeae0; cursor: pointer; font-size: 12px; }
	.tabstrip button.active { background: #fdfbf6; font-weight: 600; }
	.tab { display: none; }
	.tab.active { display: block; }
	.chat { max-width: 300px; margin: 18px auto; background: #f0ece2; border: 1px solid #b9b0a0;
	        border-radius: 4px; padding: 8px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.35); }
	.chat-title { color: #d8d0c0; text-align: center; font-size: 12px; margin-top: 18px; }
</style>

<div class="frame imagine sheet actor character">
	<div class="frame-title">Imagine RPG &mdash; Character Sheet (preview)</div>
	<div class="window-content">
		<div id="header"></div>
		<div class="tabstrip">
			<button data-t="attributes" class="active">Attributes</button>
			<button data-t="skills">Skills</button>
			<button data-t="combat">Combat</button>
			<button data-t="equipment">Equipment</button>
		</div>
		<div id="tabs"></div>
	</div>
</div>
<div class="chat-title">Chat card: the same character's attack</div>
<div class="chat" id="chat"></div>

<script type="module">
// Standalone preview of the character sheet and attack card, rendered against a character the real
// data model has derived, built from real extracted content: the race, class, weapons and armour are
// the actual documents from src/packs/documents/. Foundry is not present, so its globals are
// stubbed -- but every number on screen comes from the system's own code.
//
// Must be served over HTTP -- see tools/combat-test.html. Add ?tab=combat to open on a tab.
globalThis.foundry = {
	abstract: { TypeDataModel: class {
		constructor(data) { Object.assign(this, data); } prepareBaseData() {} prepareDerivedData() {} } },
	data: { fields: new Proxy({}, { get: () => class { constructor() {} } }) }
};
// For the preview, the Master's Manual is switched off, so its skills show as flagged.
globalThis.game = { imagine: { getAvailabilityRules: () => ({
	magicEnabled: true, magicSubsystems: {}, overrides: {}, sourcebooks: { "masters-manual": false } }) } };

const { default: ImagineCharacterData } = await import("../module/data/actor-character.mjs");
const R = await import("../module/combat/combat-rules.mjs");

Handlebars.registerHelper("eq", (a, b) => a === b);
Handlebars.registerHelper("gt", (a, b) => a > b);
Handlebars.registerHelper("lt", (a, b) => a < b);
Handlebars.registerHelper("gte", (a, b) => a >= b);
Handlebars.registerHelper("localize", (k) => {
	const names = { str: "Strength", agl: "Agility", vit: "Vitality", int: "Intelligence",
		wis: "Wisdom", knw: "Knowledge", app: "Appearance", chm: "Charm", soc: "Social Class",
		aur: "Aura", pty: "Piety", wil: "Will Force" };
	const key = String(k).split(".").pop();
	return names[key] ?? key;
});

// --- real content -------------------------------------------------------------------
const load = async (f) => (await (await fetch(`../src/packs/documents/${f}.json`)).json());
const byName = (docs, n) => { const d = docs.find(x => x.name === n); if (!d) throw new Error("missing " + n); return structuredClone(d); };
const [races, classes, weapons, armor] = await Promise.all(["races", "classes", "weapons", "armor"].map(load));

const raceItem = byName(races, "Human(Civilized:Village)");
const classItem = byName(classes, "Warrior");
classItem.getTitleName = function (t) { const i = parseInt(t) - 1; const a = this.system.advancement.titles;
                                        return (i < 0 || i >= a.length) ? "" : a[i]; };

const sword = byName(weapons, "Bastard Sword");
Object.assign(sword.system, { location: "equipped", quantity: 1, twoHanded: false });
sword.id = "w1";
const dagger = byName(weapons, "Dagger");
Object.assign(dagger.system, { location: "carried", quantity: 1 });
dagger.id = "w2";
const padding = byName(armor, "Body Suit(Padding)");
Object.assign(padding.system, { location: "equipped", quantity: 1 });
const chain = byName(armor, "Body Suit(Chain)");
Object.assign(chain.system, { location: "equipped", quantity: 1 });
// A real shield out of the armour pack, so the fifth layer renders against real content. This
// character has no handedness set, which his equipShield reads as right-handed, so the shield
// covers the LEFT shoulder, arm, forearm and hand.
const shield = byName(armor, "Shield(Large/Plate)");
Object.assign(shield.system, { location: "equipped", quantity: 1 });
const tent = { id: "g5", name: "Tent", type: "equipment", system: { weight: 40, quantity: 1, location: "mount" } };

// Skills: definitions stubbed, since starting bonuses are rolled per character.
const skillSource = [
	["Weapon Parry", "STR", "AGL", 12, 34, "class", "Player's Guide"],
	["Body Parry", "AGL", "", 14, 28, "class", "Player's Guide"],
	["Sweep", "STR", "AGL", 15, 22, "class", "Player's Guide"],
	["Weapon Knowledge", "INT", "KNW", 11, 41, "class", "Player's Guide"],
	["Weapon Lore", "INT", "KNW", 13, 19, "class", "Master's Manual"],
	["Tracking", "WIS", "KNW", 14, 16, "racial", "Player's Guide"],
	["Armoring", "STR", "KNW", 15, 30, "social", "Player's Guide"]
];
const skills = skillSource.map(([name, a1, a2, rating, bonus, category, book], i) => ({
	id: "skill" + i, name, type: "skill",
	system: { attr1: a1, attr2: a2, skillRating: rating, startingBonus: bonus, types: [],
	          abilityBonus: 0, misc: 0, isCommon: false, category, sourcebook: book }
}));

// --- his preview.png character: Title 12 Warrior, attributes as on the screenshot -------------
const ratings = { str: 19, agl: 18, vit: 18, int: 18, wis: 18, knw: 20,
                  app: 14, chm: 15, soc: 15, aur: 18, pty: 13, wil: 20 };
const attributes = {};
for (const k of Object.keys(ratings)) attributes[k] = { rating: ratings[k], permMod: 0, tempMod: 0 };
const characteristic = (titleBonus = 0) => ({ titleBonus, raceMod: 0, permMod: 0, tempMod: 0 });
const resistance = () => ({ misc: 0, immune: false });

const character = new ImagineCharacterData({
	identity: { title: 12, goal: 35, exp: 386000, alignment: "Good (Active)", tendencies: "Moral", gender: "Male" },
	attributes,
	characteristics: { endurance: characteristic(53), perception: characteristic(),
	                   affinity: characteristic(), fortune: characteristic() },
	resistances: { magic: resistance(), illusion: resistance(), control: resistance(),
	               poison: resistance(), disease: resistance() },
	body: { bodyType: "", wounds: { "Left Arm": 9, "Neck": 40 }, armorDamage: { "Upper Torso": 2 }, hide: 0 },
	physical: { weight: 215 },
	combat: { meleeMisc: 0, missileMisc: 0, damageMisc: 0, defenseMisc: 0, initiativeMisc: 0, skillMisc: 0,
	          weaponLoreList: "Bastard Sword", missileLoreList: "",
	          painThreshold: -2, highPainThreshold: false, damageAbsorb: 12,
	          spiritArmor: 0, forceArmor: 4, outerKinetic: 0, magicShield: 0,
	          invulnerable: false },
	movement: { walk: {}, jog: {}, run: {}, special: {}, specialName: "",
	            travelHours: 9, restHours: 5, jumpStand: 0, jumpUp: 0 }
});
const allItems = [...skills, sword, dagger, padding, chain, shield, tent, raceItem, classItem];
character.parent = { items: allItems, name: "Calanar Elfriend" };
character.prepareBaseData();
character.prepareDerivedData();

// --- the context the sheet class builds -------------------------------------------------
const groups = [["Physical",["str","agl","vit"]],["Mental",["int","wis","knw"]],
                ["Personal",["app","chm","soc"]],["Mystical",["aur","pty","wil"]]];
const attrRows = [];
for (const [group, keys] of groups) for (const key of keys) {
	const a = character.attributes[key];
	attrRows.push({ key, group, label: `IMAGINE.Attribute.${key}`, rating: a.rating, value: a.value,
	                max: a.max, save: a.save,
	                mods: Object.entries(a.mods ?? {}).map(([k, v]) => ({ key: k, value: v })) });
}
const skillRows = { class: [], racial: [], social: [] };
for (const it of skills) {
	const s = it.system;
	skillRows[s.category].push({ id: it.id, name: it.name, attr1: s.attr1, attr2: s.attr2,
		skillRating: s.skillRating, baseChance: s.baseChance, totalChance: s.totalChance,
		sourcebook: s.sourcebook, available: s.available !== false, unavailableReason: s.unavailableReason ?? "" });
}
for (const k of Object.keys(skillRows)) skillRows[k].sort((a, b) => a.name.localeCompare(b.name));

// Lore, as the sheet class works it out: the general figures for every weapon of the kind, the
// larger ones instead for a weapon named in the matching list.
const loreFor = (w) => {
	const modes = ["thrust", "cut", "smash", "missile"].filter(m => w.system[m]?.available);
	const l = R.getLoreModifiers({
		mode: modes.length ? modes[0] : "thrust",
		weaponName: w.name,
		hasWeaponLore: character.combat.hasWeaponLore,
		hasMissileLore: character.combat.hasMissileLore,
		weaponLoreList: character.combat.weaponLoreNames,
		missileLoreList: character.combat.missileLoreNames
	});
	return l.attack ? l : null;
};

const weaponRows = [sword, dagger].map(w => ({
	id: w.id, name: w.name, damage: w.system.damage,
	speed: w.system.speedSpecial ? "Special" : R.getWeaponSpeed(w.system.speed, w.system.minSpeed, character.combat.weaponSpeedMod),
	reload: w.system.reloadSpeed || "",
	modes: ["thrust", "cut", "smash", "missile"].filter(m => w.system[m]?.available).map(m => ({ mode: m, mod: w.system[m].mod })),
	lore: loreFor(w),
	equipped: w.system.location === "equipped"
}));

const ctx = {
	actor: { name: "Calanar Elfriend", img: "" },
	system: character,
	attributes: attrRows,
	skills: skillRows,
	gear: [sword, dagger, padding, chain, shield, tent],
	weapons: weaponRows,
	lore: {
		show: character.combat.hasWeaponLore || character.combat.hasMissileLore,
		hasWeapon: character.combat.hasWeaponLore,
		hasMissile: character.combat.hasMissileLore,
		label: [character.combat.hasWeaponLore ? "Weapon" : null,
		        character.combat.hasMissileLore ? "Missile" : null].filter(Boolean).join(" and "),
		weaponText: character.combat.weaponLoreList,
		missileText: character.combat.missileLoreList
	},
	handednessChoices: [
		{ value: "",             label: "Right (default)", selected: true },
		{ value: "Right",        label: "Right" },
		{ value: "Left",         label: "Left" },
		{ value: "Ambidextrous", label: "Ambidextrous (shields right)" }
	]
};

async function render(path, context) {
	const src = await (await fetch(path)).text();
	return Handlebars.compile(src)(context);
}
document.getElementById("header").innerHTML = await render("../templates/actor/header.hbs", ctx);
const tabs = document.getElementById("tabs");
for (const name of ["attributes", "skills", "combat", "equipment"]) {
	const div = document.createElement("div");
	div.innerHTML = await render(`../templates/actor/tab-${name}.hbs`, ctx);
	tabs.appendChild(div);
}
document.querySelector("#tabs .tab").classList.add("active");
document.querySelectorAll(".tabstrip button").forEach(btn => {
	btn.onclick = () => {
		document.querySelectorAll(".tabstrip button").forEach(b => b.classList.remove("active"));
		btn.classList.add("active");
		document.querySelectorAll("#tabs .tab").forEach(t => t.classList.toggle("active", t.dataset.tab === btn.dataset.t));
	};
});
const start = new URLSearchParams(location.search).get("tab");
if (start) document.querySelector(`.tabstrip button[data-t="${start}"]`)?.click();

// --- an attack card, resolved by the real rules --------------------------------------------
// Natural 14 with the Bastard Sword's cut, against a target with a -3 defensive adjustment.
const mods = R.getToHitModifiers({ mode: "cut", weapon: sword.system,
	attacker: { meleeAttack: character.combat.meleeAttack, missileAttack: character.combat.missileAttack,
	            meleeMisc: 0, missileMisc: 0 },
	target: { defensiveAdjust: -3 }, situational: 0 });
const result = R.resolveAttack({ natural: 14, mods: mods.total, skill: character.combat.attackSkill, calledShot: false });
const strMod = R.getStrengthDamageMod(character.combat.meleeDamage, "cut", false);
const rolled = 17 + strMod;   // sample dice total of 17 on 5d6+1
const attack = {
	weapon: sword.name, modeLabel: "Cut", actorName: "Calanar Elfriend", targetName: "Orc Raider",
	aim: "Upper Torso", result, mods,
	speed: R.getWeaponSpeed(sword.system.speed, sword.system.minSpeed, character.combat.weaponSpeedMod),
	fumble: null,
	damage: result.isHit ? { dice: sword.system.damage, str: strMod, magic: 0, misc: 0, rolled,
	                         multiplier: 1, total: rolled, type: "Cutting" } : null,
	applied: false, inCombat: true
};
document.getElementById("chat").innerHTML = await render("../templates/chat/attack-card.hbs", attack);
</script>
