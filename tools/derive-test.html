<!doctype html>
<meta charset="utf-8">
<title>Imagine RPG derivation test</title>
<style>body{font:13px monospace;padding:1rem}.p{color:#0a0}.f{color:#c00;font-weight:bold}</style>
<pre id="out">running...</pre>
<script type="module">
// Derivation tests for the character data model.
//
// Must be served over HTTP:
//     python -m http.server 8777 --bind 127.0.0.1
//     open http://127.0.0.1:8777/tools/derive-test.html
//
// Foundry is not present here, so the two globals the data model touches at import time are
// stubbed. defineSchema() is never called -- these tests drive the prepare* methods directly
// against a plain data object, which is exactly the arithmetic we care about verifying.
globalThis.foundry = {
	abstract: {
		TypeDataModel: class {
			constructor(data) { Object.assign(this, data); }
			prepareBaseData() {}
			prepareDerivedData() {}
		}
	},
	data: { fields: new Proxy({}, { get: () => class { constructor() {} } }) }
};
// The character model reads the campaign's content rules. Null means everything is available.
globalThis.game = { imagine: { getAvailabilityRules: () => null } };

const { default: ImagineCharacterData } = await import("../module/data/actor-character.mjs");

const results = [];
function check(label, actual, expected) {
	const ok = JSON.stringify(actual) === JSON.stringify(expected);
	results.push(`${ok ? "PASS" : "FAIL"}  ${label}\n        expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
	return ok;
}

// Build a character with known attribute ratings.
function makeCharacter(ratings, title = 12, items = []) {
	const attributes = {};
	for (const k of ["str","agl","vit","int","wis","knw","app","chm","soc","aur","pty","wil"]) {
		attributes[k] = { rating: ratings[k] ?? 10, permMod: 0, tempMod: 0 };
	}
	const characteristic = () => ({ titleBonus: 0, raceMod: 0, permMod: 0, tempMod: 0 });
	const resistance = () => ({ misc: 0, immune: false });

	const c = new ImagineCharacterData({
		identity: { title },
		attributes,
		characteristics: {
			endurance: characteristic(), perception: characteristic(),
			affinity: characteristic(), fortune: characteristic()
		},
		resistances: {
			magic: resistance(), illusion: resistance(), control: resistance(),
			poison: resistance(), disease: resistance()
		},
		body: { bodyType: "Humanoid", areas: [] },
		// The real schema always provides these; the fixture has to supply them too.
		combat: { meleeMisc: 0, missileMisc: 0, damageMisc: 0, defenseMisc: 0, initiativeMisc: 0, skillMisc: 0 },
		physical: { weight: 0 },
		movement: {
			walk: { hourly: 0, tenSec: 0, oneSec: 0 },
			jog:  { hourly: 0, tenSec: 0, oneSec: 0 },
			run:  { hourly: 0, tenSec: 0, oneSec: 0 },
			special: { hourly: 0, tenSec: 0, oneSec: 0 },
			specialName: "", travelHours: 0, restHours: 0, jumpStand: 0, jumpUp: 0
		}
	});
	// stand in for the owning Actor document
	c.parent = { items };
	c.prepareBaseData();
	c.prepareDerivedData();
	return c;
}

// --- attribute saves, against his getAttribSave ---------------------------------
const saves = makeCharacter({ str: 10, agl: 17, vit: 18, int: 19, wis: 20, knw: 23 });
check("STR 10 save",  saves.attributes.str.save, 50);
check("AGL 17 save",  saves.attributes.agl.save, 85);
check("VIT 18 save",  saves.attributes.vit.save, 90);
check("INT 19 save (plateaus at 90)", saves.attributes.int.save, 90);
check("WIS 20 save (plateaus at 90)", saves.attributes.wis.save, 90);
check("KNW 23 save (90 + 3 above 20)", saves.attributes.knw.save, 93);

// --- attribute table lookups ----------------------------------------------------
const c19 = makeCharacter({ str: 19 });
check("STR 19 melee attack", c19.attributes.str.mods.meleeAttack, 2);
check("STR 19 melee damage", c19.attributes.str.mods.meleeDamage, 5);
check("STR 19 load limit",   c19.attributes.str.mods.loadLimit, 1.8);
check("STR 19 weapon speed", c19.attributes.str.mods.weaponSpeed, -2);

// --- attribute maximum: the race's limit, replaced by 27 at title 11 -------------
// His sheet, not the Master's Manual. Maximums come from the race (20 before one is chosen),
// and setArchMortalAttributesMax discards them for a flat 27 on titling to 11. Nothing in his
// code caps by title below 11, and nothing grants 30 at title 16, so the book's mundane /
// mortal / deity tiers are not implemented -- see docs/DECISIONS.md.
check("no race yet means the 20 default",   ImagineCharacterData.getAttributeMax(0, 0), 20);
check("a race's limit is the maximum",      ImagineCharacterData.getAttributeMax(5, 18), 18);
check("a race may allow more than 20",      ImagineCharacterData.getAttributeMax(5, 28), 28);
check("title 11 discards the racial limit", ImagineCharacterData.getAttributeMax(11, 18), 27);
check("and it stays 27 at title 16",        ImagineCharacterData.getAttributeMax(16, 18), 27);
check("title 10 is still the racial limit", ImagineCharacterData.getAttributeMax(10, 18), 18);

const capped = makeCharacter({ str: 30 }, 1); // no race, so the maximum is the 20 default
check("rating above the maximum is clamped", capped.attributes.str.value, 20);

// --- characteristics: ceiling of each category's average ------------------------
const ch = makeCharacter({
	str: 19, agl: 18, vit: 18,   // physical  -> ceil(55/3) = 19
	int: 18, wis: 18, knw: 20,   // mental    -> ceil(56/3) = 19
	app: 14, chm: 15, soc: 15,   // personal  -> ceil(44/3) = 15
	aur: 18, pty: 13, wil: 20    // mystical  -> ceil(51/3) = 17
});
check("Endurance base (physical avg)",  ch.characteristics.endurance.base, 19);
check("Perception base (mental avg)",   ch.characteristics.perception.base, 19);
check("Affinity base (personal avg)",   ch.characteristics.affinity.base, 15);
check("Fortune base (mystical avg)",    ch.characteristics.fortune.base, 17);
check("Shock = Endurance x 3",          ch.body.shock, 57);

// exact-integer average must not round up
const exact = makeCharacter({ str: 12, agl: 12, vit: 12 });
check("exact average does not round up", exact.characteristics.endurance.base, 12);

// --- skill chances --------------------------------------------------------------
// The Player's Guide p.94 worked example: Strength 16 + Agility 14 averages to a combined 15;
// against a skill rating of 12 that is (15 - 12) x 5% = +15% base chance.
const skillActor = makeCharacter({ str: 16, agl: 14 }, 5, [
	{ type: "skill", system: { attr1: "STR", attr2: "AGL", skillRating: 12,
	  startingBonus: 7, abilityBonus: 0, misc: 0, isCommon: false, category: "class" } },
	{ type: "skill", system: { attr1: "AGL", attr2: "", skillRating: 16,
	  startingBonus: 0, abilityBonus: 0, misc: 0, isCommon: true, category: "class" } }
]);
const sk1 = skillActor.parent.items[0].system;
const sk2 = skillActor.parent.items[1].system;
check("book example: combined attributes", sk1.combinedAttributes, 15);
check("book example: base chance +15%",    sk1.baseChance, 15);
check("total = base + starting bonus",     sk1.totalChance, 22);
check("single-attribute skill combined",   sk2.combinedAttributes, 14);
check("common skill ignores starting bonus", sk2.totalChance, -10);
check("common skill does not consume a slot", skillActor.skillSlots.classUsed, 1);

// --- resistances ----------------------------------------------------------------
const res = makeCharacter({ aur: 18, wis: 18, vit: 18, wil: 20, int: 18 });
check("magic resist comes from Aura", res.resistances.magic.base, res.attributes.aur.mods.magicResist);
check("poison resist comes from Vitality", res.resistances.poison.base, res.attributes.vit.mods.poisonResist);
const controlExpected = (res.attributes.wil.mods.controlResist || 0)
                      + (res.attributes.int.mods.controlResistAdjust || 0)
                      + (res.attributes.wis.mods.controlResistAdjust || 0);
check("control resist combines WIL + INT + WIS", res.resistances.control.base, controlExpected);

const immune = makeCharacter({ aur: 18 });
immune.resistances.magic.immune = true;
immune.prepareDerivedData();
check("immunity overrides the percentage", immune.resistances.magic.value, null);

// --- race integration -----------------------------------------------------------
// A stand-in race item: +2 STR / -1 AGL, a strict Strength cap of 18, and movement rates.
function makeRace(overrides = {}) {
	return {
		type: "race",
		name: "Testfolk",
		system: {
			attributeMods: { str: 2, agl: -1, vit: 0, int: 0, wis: 0, knw: 0,
			                 app: 0, chm: 0, soc: 0, aur: 0, pty: 0, wil: 0 },
			attributeLimits: { str: 18, agl: 20, vit: 20, int: 20, wis: 20, knw: 20,
			                   app: 20, chm: 20, soc: 20, aur: 20, pty: 20, wil: 20 },
			endurance: { startFormula: "", startMod: 4, titleFormula: "", titleDice: "", titleMax: 0, titleMod: 0 },
			characteristicMods: { perception: 3, affinity: -2, fortune: 1 },
			resistanceMods: { magic: 10, illusion: 0, control: 0, poison: 5, disease: 0 },
			movement: {
				speedMultiplier: 1,
				walk: { hourly: 6, tenSec: 60, oneSec: 6 },
				jog:  { hourly: 12, tenSec: 120, oneSec: 12 },
				run:  { hourly: 18, tenSec: 180, oneSec: 18 },
				specialName: "Fly:",
				special: { hourly: "", hourlyMultiplier: 0, hourlyMod: 0, tenSec: "", tenSecMultiplier: 0,
				           tenSecMod: 0, oneSec: "", oneSecMultiplier: 0, oneSecMod: 0 },
				jumpStand: 8, jumpUp: 3.5
			},
			formless: false, canSwim: true,
			...overrides
		}
	};
}

const raced = makeCharacter({ str: 14, agl: 14, vit: 14, int: 12, wis: 12, knw: 12,
                              app: 12, chm: 12, soc: 12, aur: 12, pty: 12, wil: 12 },
                            12, [makeRace()]);
check("racial attribute modifier is applied", raced.attributes.str.value, 16);   // 14 + 2
check("negative racial modifier is applied",  raced.attributes.agl.value, 13);   // 14 - 1
// Below title 11 the race's limits are the maximums.
const racedLow = makeCharacter({ str: 14, agl: 14, vit: 14, int: 12 }, 5, [makeRace()]);
check("racial limit is the maximum below title 11", racedLow.attributes.str.max, 18);
check("an unrestricted attribute takes the race's own 20", racedLow.attributes.int.max, 20);

// From title 11 they are discarded for a flat 27, upwards as well as downwards.
check("title 11 and up discards the racial limit", raced.attributes.str.max, 27);
// Strength 20 plus the race's +2 is 22. The race's limit of 18 would have clamped that before
// title 11; at 16 the limit is gone and 22 stands, well under the flat 27.
const capRace = makeCharacter({ str: 20 }, 16, [makeRace()]); // race limit 18, but arch-mortal
check("a rating the race would have barred now stands", capRace.attributes.str.value, 22);
check("and the maximum is 27, not the book's deity 30", capRace.attributes.str.max, 27);

// Endurance: physical average of the POST-racial values, plus the racial endurance modifier.
// str 14+2=16, agl 14-1=13, vit 14 -> ceil(43/3) = 15, +4 racial = 19
check("Endurance uses post-racial attributes", raced.characteristics.endurance.base, 15);
check("racial endurance modifier is applied",  raced.characteristics.endurance.value, 19);
check("racial characteristic modifier",        raced.characteristics.perception.raceMod, 3);
check("racial resistance modifier is added",
	raced.resistances.magic.value, raced.resistances.magic.base + 10);
check("movement comes from the race",          raced.movement.walk.tenSec, 60);
check("special movement name from the race",   raced.movement.specialName, "Fly:");
check("race name surfaces on identity",        raced.identity.raceName, "Testfolk");

// --- class integration ----------------------------------------------------------
const classItem = {
	type: "class",
	name: "Warrior",
	system: {
		classType: "Primary class",
		advancement: { titles: ["Recruit", "Soldier", "Veteran"], goalAttr1: "STR", goalAttr2: "AGL" }
	},
	getTitleName(t) {
		const i = parseInt(t) - 1;
		if (i < 0 || i >= this.system.advancement.titles.length) { return ""; }
		return this.system.advancement.titles[i];
	}
};
const classed = makeCharacter({ str: 14 }, 2, [classItem]);
check("class name surfaces on identity", classed.identity.className, "Warrior");
check("class type surfaces on identity", classed.identity.classType, "Primary class");
check("title name resolves for the title held", classed.identity.titleName, "Soldier");
const overTitle = makeCharacter({ str: 14 }, 9, [classItem]);
check("title beyond the class list returns empty", overTitle.identity.titleName, "");

// --- encumbrance ----------------------------------------------------------------
// STR 11 has a load limit of 1.0, so a 200 lb character maxes out at 200 lb carried.
// Bands fall at a quarter, half, three quarters and the whole of that.
function gear(weight, location = "carried", extra = {}) {
	return { type: "equipment", name: "thing",
	         system: { weight, quantity: 1, location, isTagalong: false, ...extra } };
}
function encumbered(items) {
	const c = makeCharacter({ str: 11 }, 5, items);
	c.physical = { weight: 200 };
	c.prepareDerivedData();
	return c.encumbrance;
}

const e0 = encumbered([]);
check("max load = load limit x body weight", e0.maxLoad, 200);
check("band thresholds at 25/50/75/100%",
	[e0.none, e0.slight, e0.moderate, e0.heavy], [50, 100, 150, 200]);
check("nothing carried is unencumbered", e0.status, "Unencumbered");

check("carried weight totals up",        encumbered([gear(30), gear(25)]).carried, 55);
check("just over a quarter is Slight",   encumbered([gear(60)]).status, "Slight");
check("just over a half is Moderate",    encumbered([gear(120)]).status, "Moderate");
check("just over three quarters is Heavy", encumbered([gear(175)]).status, "Heavy");
check("beyond the load limit is Overloaded", encumbered([gear(250)]).status, "Overloaded");

// Things not on your person do not weigh you down.
check("stashed gear does not count",  encumbered([gear(500, "stash")]).carried, 0);
check("gear on a mount does not count", encumbered([gear(500, "mount")]).carried, 0);
check("equipped gear does count",     encumbered([gear(40, "equipped")]).carried, 40);

// Tagalong items are already counted inside another item's weight -- charging them again
// would double-bill the character.
check("tagalong items are not double counted",
	encumbered([gear(10), gear(999, "carried", { isTagalong: true })]).carried, 10);

// Quantity multiplies.
check("quantity multiplies weight",
	encumbered([{ type: "equipment", name: "arrows",
	  system: { weight: 0.1, quantity: 20, location: "carried", isTagalong: false } }]).carried, 2);

// --- combat values ----------------------------------------------------------------
// A Warrior-ish class whose attack progression reaches Intermediate at title 5.
const fighterClass = {
	type: "class", name: "Fighter",
	system: { classType: "Primary class", attackSkillList: "Beginner at 1, Novice at 3, Intermediate at 5, Advanced at 7",
	          advancement: { titles: [], goalAttr1: "", goalAttr2: "" } },
	getTitleName() { return ""; }
};
// A worn heavy scale suit: skills -20, defence +3, initiative +1, speed +2 (armorpenaltydict).
const scaleSuit = {
	type: "armor", name: "Body Suit(Heavy Scale)",
	system: { location: "equipped", material: "Heavy Scale", weight: 30, quantity: 1,
	          penalties: { skills: -20, defense: 3, initiative: 1, speed: 2 },
	          coverage: { head: 0, neck: 0, shoulderLeft: 12, shoulderRight: 12, torsoUpper: 12,
	                      torsoMid: 12, torsoLower: 12, armLeft: 12, armRight: 12, forearmLeft: 0,
	                      forearmRight: 0, handLeft: 0, handRight: 0, thighLeft: 12, thighRight: 12,
	                      shinLeft: 0, shinRight: 0, footLeft: 0, footRight: 0 } }
};
const padding = {
	type: "armor", name: "Padding", system: { location: "equipped", material: "Padding", weight: 5, quantity: 1,
	penalties: { skills: 0, defense: 0, initiative: 0, speed: 0 },
	coverage: { head: 0, neck: 0, shoulderLeft: 3, shoulderRight: 3, torsoUpper: 3, torsoMid: 3, torsoLower: 3,
	            armLeft: 0, armRight: 0, forearmLeft: 0, forearmRight: 0, handLeft: 0, handRight: 0,
	            thighLeft: 0, thighRight: 0, shinLeft: 0, shinRight: 0, footLeft: 0, footRight: 0 } }
};
const stashedHelm = {
	type: "armor", name: "Great Helm", system: { location: "stash", material: "Plate", weight: 8, quantity: 1,
	penalties: { skills: 0, defense: 0, initiative: 5, speed: 5 },
	coverage: { head: 20, neck: 0, shoulderLeft: 0, shoulderRight: 0, torsoUpper: 0, torsoMid: 0, torsoLower: 0,
	            armLeft: 0, armRight: 0, forearmLeft: 0, forearmRight: 0, handLeft: 0, handRight: 0,
	            thighLeft: 0, thighRight: 0, shinLeft: 0, shinRight: 0, footLeft: 0, footRight: 0 } }
};

// AGL 18 -> initiative -7, defensive -3, weapon speed -2; INT 18 -> initiative -7; STR 19 -> speed -2.
const fighter = makeCharacter({ str: 19, agl: 18, vit: 18, int: 18 }, 5,
	[fighterClass, scaleSuit, padding, stashedHelm]);
check("attack skill comes from the class progression at title 5", fighter.combat.attackSkill, "Intermediate");
check("initiative = best of AGL/INT (-7) + worn armour (+1)", fighter.combat.initiativeMod,
	Math.min(fighter.attributes.agl.mods.initiativeAdjust, fighter.attributes.int.mods.initiativeAdjust) + 1);
check("armour left in a stash does not slow initiative", fighter.combat.initiativeMod < 0, true);
check("defence = AGL defensive adjustment + worn armour (+3)", fighter.combat.defensiveAdjust,
	fighter.attributes.agl.mods.defensiveAdjust + 3);
check("weapon speed = STR + AGL + worn armour", fighter.combat.weaponSpeedMod,
	fighter.attributes.str.mods.weaponSpeed + fighter.attributes.agl.mods.weaponSpeed + 2);
check("armour skill penalty is totalled", fighter.combat.armorSkillPenalty, -20);
check("no class means no attack skill", makeCharacter({}, 5).combat.attackSkill, "None");

// --- the body -----------------------------------------------------------------------
check("Humanoid body has 19 areas", fighter.body.areas.length, 19);
const upper = fighter.body.areas.find(a => a.name === "Upper Torso");
const neck = fighter.body.areas.find(a => a.name === "Neck");
const endValue = fighter.characteristics.endurance.value;
check("Upper Torso Endurance = Endurance x 2", upper.endurance, endValue * 2);
check("Neck Endurance = Endurance x 1/2, rounded up", neck.endurance, Math.ceil(endValue / 2));
check("armour sums every worn layer covering the area (12 + 3)", upper.armor, 15);
check("both layers are listed for the area", upper.layers, ["Body Suit(Heavy Scale)", "Padding"]);
check("the strongest material covering it is recorded", typeof upper.material, "string");
check("a helm left in the stash protects nothing", fighter.body.areas.find(a => a.name === "Head").armor, 0);

// Wounds and armour damage are stored by area name.
const hurt = makeCharacter({ str: 19, agl: 18, vit: 18 }, 5, [scaleSuit]);
hurt.body.wounds = { "Neck": 12, "Left Arm": 3 };
hurt.body.armorDamage = { "Upper Torso": 5 };
hurt.prepareDerivedData();
const hNeck = hurt.body.areas.find(a => a.name === "Neck");
check("wounds are read back by area name", hNeck.wounds, 12);
// Endurance ceil((19+18+18)/3) = 19, so the Neck (x1/2) is 10; 12 wounds is past 10 but under 10 + VIT 18.
check("neck Endurance for this character is 10", hNeck.endurance, 10);
check("past the area's Endurance: needs a Vitality save", hNeck.state, "vitalitySave");
check("a lightly hurt area is just wounded", hurt.body.areas.find(a => a.name === "Left Arm").state, "wounded");
check("an untouched area is sound", hurt.body.areas.find(a => a.name === "Head").state, "sound");
check("armour damage reduces the armour there (12 - 5)", hurt.body.areas.find(a => a.name === "Upper Torso").armor, 7);
check("total wounds across the body", hurt.body.totalWounds, 15);
check("not in shock below Shock", hurt.body.inShock, false);

// The race's body chart is used, and an explicit body type overrides it.
const winged = makeCharacter({}, 5, [{ ...makeRace(), system: { ...makeRace().system, bodyType: "Humanoid(Wings)" } }]);
winged.body.bodyType = "";
winged.prepareDerivedData();
check("the race's body chart is used", winged.body.type, "Humanoid(Wings)");
check("winged humanoids have their wings", winged.body.areas.some(a => a.name.includes("Wing")), true);
check("wings take no protection from humanoid armour", winged.body.areas.find(a => a.name.includes("Wing")).protectedByArmor, false);
winged.body.bodyType = "Quadruped";
winged.prepareDerivedData();
check("an explicit body type overrides the race (a transformation)", winged.body.type, "Quadruped");

// --- skill slots ----------------------------------------------------------------
const slots = makeCharacter({ knw: 20 });
check("skill slots read off the Knowledge table",
	[slots.skillSlots.class, slots.skillSlots.racial, slots.skillSlots.social],
	[slots.attributes.knw.mods.classSkills, slots.attributes.knw.mods.raceSkills, slots.attributes.knw.mods.socialSkills]);

const passed = results.filter(r => r.startsWith("PASS")).length;
const failed = results.length - passed;
document.getElementById("out").innerHTML =
	results.map(r => `<span class="${r.startsWith("PASS") ? "p" : "f"}">${r}</span>`).join("\n")
	+ `\n\n${passed} passed, ${failed} failed`;
</script>
